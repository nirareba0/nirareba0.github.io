<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>事前インタビューの予約｜韮崎100人カイギ</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#fcf7ef;--card:#fff;--ink:#141414;--muted:#5b574f;--rule:#ddd5c5;--accent:#c0603a;--accent2:#f5e4d8;--blue:#015ad2}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.8 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;letter-spacing:.03em}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 120px}
.k{font-size:13px;color:var(--accent);letter-spacing:.14em;font-weight:600;margin:0}
h1{font-size:24px;line-height:1.5;margin:6px 0 4px}
.lead{color:var(--muted);font-size:14px;margin:0 0 18px}
h2{font-size:17px;margin:28px 0 10px;display:flex;gap:8px;align-items:center}
h2 b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scroll-snap-type:x mandatory}
.day{flex:none;scroll-snap-align:start;border:1.5px solid var(--rule);background:var(--card);border-radius:12px;padding:8px 12px;text-align:center;min-width:72px;cursor:pointer;font:inherit;color:inherit}
.day small{display:block;font-size:12px;color:var(--muted)}
.day strong{font-size:18px}
.day[aria-pressed=true]{border-color:var(--accent);background:var(--accent2)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:10px 0;font:600 16px/1 inherit;color:inherit;cursor:pointer;font-family:inherit}
.slot[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}
label{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
input[type=text],textarea{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:12px;font:inherit;background:var(--card)}
textarea{min-height:84px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:12px 0;font:600 15px/1 inherit;font-family:inherit;cursor:pointer;color:inherit}
.seg button[aria-pressed=true]{border-color:var(--accent);background:var(--accent2)}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(252,247,239,.96);border-top:1px solid var(--rule);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.sel{font-size:13px;color:var(--muted);margin:0 0 8px;min-height:1.4em}
.go{width:100%;border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 17px/1 inherit;font-family:inherit;padding:16px 0;cursor:pointer}
.go:disabled{opacity:.4}
.msg{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:16px;margin-top:16px}
.err{color:#b3261e;font-size:14px;margin:10px 0 0}
.done h1{margin-top:24px}
.done .card{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:16px;margin:16px 0}
.done dt{font-size:12.5px;color:var(--muted)}.done dd{margin:0 0 10px;font-weight:600}
.loading{color:var(--muted);padding:24px 0}
.note{font-size:12px;color:var(--muted);margin-top:28px}
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head><body>
<div class="wrap" id="app">
<p class="k">韮崎100人カイギ</p>
<h1>事前インタビューの予約</h1>
<p class="lead">登壇の前に、運営が1時間ほどお話をうかがいます。空いている時間から選んでください。</p>
<div id="body"><p class="loading">空いている時間を読み込んでいます…</p></div>
<p class="note">入力した内容は、日程の調整と当日の連絡にだけ使います。予定は運営（西村）のカレンダーに入り、予約内容は LINE のトークにも送られます。</p>
</div>
<div class="bar" id="bar" hidden><div class="in"><p class="sel" id="sel"></p><button class="go" id="go" disabled>この内容で予約する</button><p class="err" id="err" hidden></p></div></div>
<script>
const LIFF_ID = '2011959095-i410ID14';
const API = 'https://script.google.com/macros/s/AKfycbyevzHDitgKhgKSizgf1Wur1HIUe7OdqDAUMUNemNcTbyyfuvQV-CVbkgQDt_E7EXcb/exec';
const W = '日月火水木金土';
const st = { slots: [], day: null, start: null, placeType: 'online', idToken: null, name: '' };
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
const jst = iso => new Date(new Date(iso).getTime() + 9 * 3600000); // 表示用（UTC の getter で読む）
const dayKey = iso => { const d = jst(iso); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) };
const hm = iso => { const d = jst(iso); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) };
const md = iso => { const d = jst(iso); return (d.getUTCMonth() + 1) + '/' + d.getUTCDate() + '（' + W[d.getUTCDay()] + '）' };
const esc = s => s.replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return }
    st.idToken = liff.getIDToken();
    try { const p = await liff.getProfile(); st.name = p.displayName || '' } catch (e) {}
  } catch (e) { /* LINE の外で開いたとき。予約は LINE の中でだけ受ける */ }
  try {
    const r = await fetch(API + '?action=slots');
    const j = await r.json();
    st.slots = j.slots || [];
  } catch (e) { $('#body').innerHTML = '<div class="msg">空き時間を読み込めませんでした。少しあとで開き直してください。</div>'; return }
  if (!st.idToken) { $('#body').innerHTML = '<div class="msg">この予約ページは LINE の中で開いてください。たいどの公式LINE のトークにあるリンクから開けます。</div>'; return }
  render();
}

function render() {
  if (!st.slots.length) { $('#body').innerHTML = '<div class="msg">いま空いている時間がありません。このトークで西村に直接ご相談ください。</div>'; return }
  const days = [...new Set(st.slots.map(dayKey))];
  if (!st.day) st.day = days[0];
  const list = st.slots.filter(s => dayKey(s) === st.day);
  $('#body').innerHTML = `
  <h2><b>1</b>日にちと時間</h2>
  <div class="days">${days.map(k => { const s = st.slots.find(x => dayKey(x) === k); return `<button class="day" data-day="${k}" aria-pressed="${k === st.day}"><small>${md(s).replace(/（.）/, '')}</small><strong>${md(s).match(/（(.)）/)[1]}</strong></button>` }).join('')}</div>
  <div class="slots">${list.map(s => `<button class="slot" data-start="${s}" aria-pressed="${s === st.start}">${hm(s)}</button>`).join('')}</div>
  <p class="hint">1回60分です。火曜日はお休みです。</p>
  <h2><b>2</b>実施場所</h2>
  <div class="seg"><button data-place="online" aria-pressed="${st.placeType === 'online'}">オンライン</button><button data-place="meet" aria-pressed="${st.placeType === 'meet'}">会って話す</button></div>
  <label for="place">${st.placeType === 'online' ? 'ご希望（任意）' : '会う場所'}</label>
  <input id="place" type="text" maxlength="100" placeholder="${st.placeType === 'online' ? '例: Zoom がいい、カメラなしで など' : '例: 韮崎駅の近くのカフェ、お店で など'}" value="${esc(st.placeDetail || '')}">
  <h2><b>3</b>お名前とひとこと</h2>
  <label for="name">お名前</label>
  <input id="name" type="text" maxlength="40" value="${esc(st.nameInput ?? st.name)}" placeholder="例: 西村 直樹">
  <label for="note">ひとこと（任意）</label>
  <textarea id="note" maxlength="300" placeholder="登壇の回が決まっていれば、その回も">${esc(st.note || '')}</textarea>`;
  $('#bar').hidden = false;
  document.querySelectorAll('.day').forEach(b => b.onclick = () => { keep(); st.day = b.dataset.day; render() });
  document.querySelectorAll('.slot').forEach(b => b.onclick = () => { keep(); st.start = b.dataset.start; render() });
  document.querySelectorAll('[data-place]').forEach(b => b.onclick = () => { keep(); st.placeType = b.dataset.place; render() });
  ['#place', '#name', '#note'].forEach(s => $(s).oninput = () => { keep(); upd() });
  upd();
}
function keep() { const p = $('#place'), n = $('#name'), t = $('#note'); if (p) st.placeDetail = p.value; if (n) st.nameInput = n.value; if (t) st.note = t.value }
function upd() {
  const name = (st.nameInput ?? st.name).trim();
  const okPlace = st.placeType === 'online' || (st.placeDetail || '').trim();
  $('#sel').textContent = st.start ? `${md(st.start)} ${hm(st.start)}〜・${st.placeType === 'online' ? 'オンライン' : '会って'}` : '時間を選んでください';
  $('#go').disabled = !(st.start && name && okPlace);
}

$('#go').onclick = async () => {
  keep(); $('#go').disabled = true; $('#err').hidden = true; $('#go').textContent = '予約しています…';
  const body = { idToken: st.idToken, start: st.start, name: (st.nameInput ?? st.name).trim(), placeType: st.placeType, placeDetail: (st.placeDetail || '').trim(), note: (st.note || '').trim() };
  let j;
  try { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); j = await r.json() }
  catch (e) { j = { ok: false, error: '送れませんでした。電波のよいところでもう一度どうぞ' } }
  if (!j.ok) {
    $('#err').textContent = j.error || 'うまくいきませんでした'; $('#err').hidden = false; $('#go').textContent = 'この内容で予約する';
    if (/埋まり/.test(j.error || '')) { try { const r = await fetch(API + '?action=slots'); st.slots = (await r.json()).slots || []; st.start = null; render() } catch (e) {} }
    upd(); return
  }
  const text = ['【100人カイギ 事前インタビューの予約】', '日時: ' + j.label, '場所: ' + j.place, 'お名前: ' + body.name].concat(body.note ? ['ひとこと: ' + body.note] : []).join('\n');
  let sent = false;
  try { if (liff.isInClient()) { await liff.sendMessages([{ type: 'text', text }]); sent = true } } catch (e) {}
  $('#bar').hidden = true;
  document.querySelector('.wrap').innerHTML = `<div class="done"><p class="k">韮崎100人カイギ</p><h1>予約しました</h1>
  <div class="card"><dl><dt>日時</dt><dd>${esc(j.label)}</dd><dt>場所</dt><dd>${esc(j.place)}</dd><dt>お名前</dt><dd>${esc(body.name)}</dd></dl></div>
  <p>${sent ? '予約の内容を LINE のトークにも送りました。' : ''}当日までに、西村からトークで確認のご連絡をします。日時を変えたいときも、トークでお知らせください。</p>
  <button class="go" onclick="liff.closeWindow()">トークに戻る</button></div>`;
};
main();
</script>
</body></html>
