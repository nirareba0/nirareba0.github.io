<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>事前インタビューの予約｜韮崎100人カイギ</title>
<meta name="robots" content="noindex">
<style>
:root{--paper:#fcf7ef;--card:#fff;--ink:#141414;--muted:#5b574f;--rule:#ddd5c5;--accent:#c0603a;--accent2:#f5e4d8;--off:#eee8dc}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.8 "Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",sans-serif;letter-spacing:.03em}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 130px}
.k{font-size:13px;color:var(--accent);letter-spacing:.14em;font-weight:600;margin:0}
h1{font-size:24px;line-height:1.5;margin:6px 0 4px}
.lead{color:var(--muted);font-size:14px;margin:0 0 8px}
h2{font-size:17px;margin:28px 0 10px;display:flex;gap:8px;align-items:center}
h2 b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--accent);color:#fff;font-size:13px;flex:none}
input[type=text],input[type=date],textarea{width:100%;border:1.5px solid var(--rule);border-radius:10px;padding:12px;font:inherit;background:var(--card);color:inherit}
textarea{min-height:84px}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
.hint{font-size:12.5px;color:var(--muted);margin:6px 0 0}
.cal{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:12px}
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.cal-h strong{font-size:17px}
.cal-h button{border:1.5px solid var(--rule);background:var(--paper);border-radius:999px;width:38px;height:38px;font-size:18px;cursor:pointer;color:inherit}
.cal-h button:disabled{opacity:.3}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.grid .w{font-size:12px;color:var(--muted);padding:2px 0}
.grid .w:first-child{color:#b3261e}.grid .w:nth-child(7){color:#1d4ed8}
.d{aspect-ratio:1/1;min-width:0;width:100%;padding:0;border:0;border-radius:10px;background:transparent;font:600 15px/1 inherit;font-family:inherit;color:#b9b1a3;display:grid;place-items:center;position:relative}
.d.ok{background:var(--accent2);color:var(--ink);cursor:pointer}
.d.ok::after{content:"";position:absolute;bottom:6px;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.d.sel{background:var(--accent);color:#fff}.d.sel::after{background:#fff}
.d.ev{outline:2px solid var(--ink);outline-offset:-2px;color:var(--ink)}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.slot{border:1.5px solid var(--rule);background:var(--card);border-radius:10px;padding:11px 0;font:600 16px/1 inherit;font-family:inherit;color:inherit;cursor:pointer}
.slot[aria-pressed=true]{border-color:var(--accent);background:var(--accent);color:#fff}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:8px;flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px}
.places{display:grid;gap:8px}
.pl{display:flex;gap:12px;align-items:flex-start;text-align:left;border:1.5px solid var(--rule);background:var(--card);border-radius:12px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer}
.pl .r{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--rule);margin-top:3px}
.pl[aria-pressed=true]{border-color:var(--accent);background:var(--accent2)}
.pl[aria-pressed=true] .r{border:6px solid var(--accent)}
.pl strong{display:block;font-size:15.5px}.pl small{display:block;font-size:12.5px;color:var(--muted);line-height:1.6}
.bar{position:fixed;left:0;right:0;bottom:0;background:rgba(252,247,239,.97);border-top:1px solid var(--rule);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.sel{font-size:13px;color:var(--muted);margin:0 0 8px;min-height:1.4em}
.go{width:100%;border:0;border-radius:999px;background:var(--accent);color:#fff;font:700 17px/1 inherit;font-family:inherit;padding:16px 0;cursor:pointer}
.go:disabled{opacity:.4}
.msg{background:var(--card);border:1.5px solid var(--rule);border-radius:12px;padding:16px;margin-top:12px;font-size:15px}
.err{color:#b3261e;font-size:14px;margin:10px 0 0}
.done .card{background:var(--card);border:1.5px solid var(--rule);border-radius:14px;padding:16px;margin:16px 0}
.done dt{font-size:12.5px;color:var(--muted)}.done dd{margin:0 0 10px;font-weight:600}
.loading{color:var(--muted);padding:24px 0}
.note{font-size:12px;color:var(--muted);margin-top:28px}
</style>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head><body>
<div class="wrap" id="app">
<p class="k">韮崎100人カイギ</p>
<h1>事前インタビューの予約</h1>
<p class="lead">登壇の前に、運営が1時間ほどお話をうかがいます。まず登壇する日を選ぶと、その1か月前から3日前までの空いている時間が出ます。</p>
<div id="body"><p class="loading">空いている時間を読み込んでいます…</p></div>
<p class="note">入力した内容は、日程の調整と当日の連絡にだけ使います。予定は運営（西村）のカレンダーに入り、予約内容は LINE のトークにも送られます。</p>
</div>
<div class="bar" id="bar" hidden><div class="in"><p class="sel" id="sel"></p><button class="go" id="go" disabled>この内容で予約する</button><p class="err" id="err" hidden></p></div></div>
<script>
const LIFF_ID = '2011959095-i410ID14';
const API = 'https://script.google.com/macros/s/AKfycbyevzHDitgKhgKSizgf1Wur1HIUe7OdqDAUMUNemNcTbyyfuvQV-CVbkgQDt_E7EXcb/exec';
const W = '日月火水木金土';
const PLACES = [
  { id: 'own', t: 'ご自身の工房・お店・職場など', s: 'いつもの場所でお話をうかがえるとうれしいです。場所を書いてください', need: true, ph: '例: ○○工房（韮崎市△△町）' },
  { id: 'nicori', t: 'ニコリの地下', s: 'ご自身の場所が難しいときはこちらで', need: false, ph: '（書かなくて大丈夫です）' },
  { id: 'online', t: 'オンライン', s: 'どうしても会うのが難しいときに', need: false, ph: '例: Zoom、Google Meet など' },
];
const st = { slots: [], ev: '', month: null, day: null, start: null, place: 'own', idToken: null, name: '' };
const $ = s => document.querySelector(s);
const pad = n => String(n).padStart(2, '0');
// 日本時間で読む（UTC の getter を使う）
const J = iso => new Date(new Date(iso).getTime() + 9 * 3600000);
const keyOf = iso => { const d = J(iso); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()) };
const hm = iso => { const d = J(iso); return pad(d.getUTCHours()) + ':' + pad(d.getUTCMinutes()) };
const lbl = key => { const [y, m, d] = key.split('-').map(Number); const w = new Date(Date.UTC(y, m - 1, d)).getUTCDay(); return m + '/' + d + '（' + W[w] + '）' };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
// 登壇日から予約できる期間 [from, until)（日本時間の 0:00 基準）
function windowOf(ev) {
  const [y, m, d] = ev.split('-').map(Number);
  const j0 = (yy, mm, dd) => Date.UTC(yy, mm - 1, dd) - 9 * 3600000;
  return [j0(y, m - 1, d), j0(y, m, d) - 2 * 86400000];
}
const todayKey = () => keyOf(new Date().toISOString());

async function main() {
  try {
    await liff.init({ liffId: LIFF_ID });
    if (!liff.isLoggedIn()) { liff.login({ redirectUri: location.href }); return }
    st.idToken = liff.getIDToken();
    try { const p = await liff.getProfile(); st.name = p.displayName || '' } catch (e) {}
  } catch (e) {}
  try { const r = await fetch(API + '?action=slots'); st.slots = (await r.json()).slots || [] }
  catch (e) { $('#body').innerHTML = '<div class="msg">空き時間を読み込めませんでした。少しあとで開き直してください。</div>'; return }
  if (!st.idToken) { $('#body').innerHTML = '<div class="msg">この予約ページは LINE の中で開いてください。たいどの公式LINE のトークにあるリンクから開けます。</div>'; return }
  render();
}

function avail() {
  if (!st.ev) return [];
  const [f, u] = windowOf(st.ev);
  return st.slots.filter(s => { const t = new Date(s).getTime(); return t >= f && t < u });
}

function calHtml(list) {
  const days = new Set(list.map(keyOf));
  const months = [...new Set(list.map(s => keyOf(s).slice(0, 7)))];
  if (!st.month || !months.includes(st.month)) st.month = months[0];
  const [y, m] = st.month.split('-').map(Number);
  const first = new Date(Date.UTC(y, m - 1, 1)).getUTCDay();
  const n = new Date(Date.UTC(y, m, 0)).getUTCDate();
  const i = months.indexOf(st.month);
  let cells = W.split('').map(w => `<div class="w">${w}</div>`).join('');
  for (let k = 0; k < first; k++) cells += '<div></div>';
  for (let d = 1; d <= n; d++) {
    const key = y + '-' + pad(m) + '-' + pad(d);
    const ok = days.has(key);
    const cls = ['d', ok ? 'ok' : '', key === st.day ? 'sel' : '', key === st.ev ? 'ev' : ''].join(' ');
    cells += ok ? `<button class="${cls}" data-day="${key}" aria-label="${lbl(key)}">${d}</button>` : `<div class="${cls}" title="${key === st.ev ? '登壇日' : ''}">${d}</div>`;
  }
  return `<div class="cal"><div class="cal-h"><button id="prev" ${i <= 0 ? 'disabled' : ''} aria-label="前の月">‹</button><strong>${y}年${m}月</strong><button id="next" ${i >= months.length - 1 ? 'disabled' : ''} aria-label="次の月">›</button></div>
  <div class="grid">${cells}</div>
  <div class="legend"><span><i style="background:var(--accent2)"></i>予約できる日</span><span><i style="background:var(--accent)"></i>選んだ日</span></div></div>`;
}

function render() {
  keep();
  const list = avail();
  let h = `<h2><b>1</b>登壇する日</h2>
  <input id="ev" type="date" value="${st.ev}" min="${todayKey()}">
  <p class="hint">登壇の回が決まっていない方は、このトークで西村にご相談ください。</p>`;
  if (st.ev) {
    h += `<h2><b>2</b>インタビューの日時</h2>`;
    if (!list.length) h += `<div class="msg">${lbl(st.ev)}の登壇なら ${lbl(keyOf(new Date(windowOf(st.ev)[0]).toISOString()))}〜${lbl(keyOf(new Date(windowOf(st.ev)[1] - 1).toISOString()))} が予約できる期間ですが、空いている時間がありません。このトークで西村にご相談ください。</div>`;
    else {
      h += calHtml(list);
      if (st.day && list.some(s => keyOf(s) === st.day)) h += `<div class="slots">${list.filter(s => keyOf(s) === st.day).map(s => `<button class="slot" data-start="${s}" aria-pressed="${s === st.start}">${hm(s)}</button>`).join('')}</div>`;
      else h += `<p class="hint">色のついた日を押すと、時間が出ます。1回60分です。火曜日はお休みです。</p>`;
    }
    const P = PLACES.find(p => p.id === st.place);
    h += `<h2><b>3</b>場所</h2><p class="hint" style="margin:-4px 0 10px">基本は会ってお話しします。上から順におすすめです。</p>
    <div class="places">${PLACES.map(p => `<button class="pl" data-place="${p.id}" aria-pressed="${p.id === st.place}"><span class="r"></span><span><strong>${p.t}</strong><small>${p.s}</small></span></button>`).join('')}</div>
    <label class="f" for="place">${P.need ? '場所（名前や住所）' : 'メモ（任意）'}</label>
    <input id="place" type="text" maxlength="100" placeholder="${P.ph}" value="${esc(st.placeDetail || '')}">
    <h2><b>4</b>お名前とひとこと</h2>
    <label class="f" for="name">お名前</label>
    <input id="name" type="text" maxlength="40" value="${esc(st.nameInput ?? st.name)}" placeholder="例: 西村 直樹">
    <label class="f" for="note">ひとこと（任意）</label>
    <textarea id="note" maxlength="300" placeholder="話したいテーマが決まっていれば">${esc(st.note || '')}</textarea>`;
  }
  $('#body').innerHTML = h;
  $('#bar').hidden = !st.ev;
  $('#ev').onchange = e => { st.ev = e.target.value; st.day = null; st.start = null; st.month = null; render() };
  document.querySelectorAll('[data-day]').forEach(b => b.onclick = () => { st.day = b.dataset.day; st.start = null; render() });
  document.querySelectorAll('.slot').forEach(b => b.onclick = () => { st.start = b.dataset.start; render() });
  document.querySelectorAll('[data-place]').forEach(b => b.onclick = () => { st.place = b.dataset.place; render() });
  const months = [...new Set(list.map(s => keyOf(s).slice(0, 7)))];
  if ($('#prev')) $('#prev').onclick = () => { st.month = months[months.indexOf(st.month) - 1]; render() };
  if ($('#next')) $('#next').onclick = () => { st.month = months[months.indexOf(st.month) + 1]; render() };
  ['#place', '#name', '#note'].forEach(s => { if ($(s)) $(s).oninput = () => { keep(); upd() } });
  upd();
}
function keep() { const p = $('#place'), n = $('#name'), t = $('#note'); if (p) st.placeDetail = p.value; if (n) st.nameInput = n.value; if (t) st.note = t.value }
function upd() {
  if (!$('#go')) return;
  const name = (st.nameInput ?? st.name).trim();
  const P = PLACES.find(p => p.id === st.place);
  const okPlace = !P.need || (st.placeDetail || '').trim();
  $('#sel').textContent = st.start ? `${lbl(keyOf(st.start))} ${hm(st.start)}〜・${P.t}` : (st.ev ? '日時を選んでください' : '');
  $('#go').disabled = !(st.ev && st.start && name && okPlace);
}

$('#go').onclick = async () => {
  keep(); $('#go').disabled = true; $('#err').hidden = true; $('#go').textContent = '予約しています…';
  const body = { idToken: st.idToken, eventDate: st.ev, start: st.start, name: (st.nameInput ?? st.name).trim(), placeType: st.place, placeDetail: (st.placeDetail || '').trim(), note: (st.note || '').trim() };
  let j;
  try { const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) }); j = await r.json() }
  catch (e) { j = { ok: false, error: '送れませんでした。電波のよいところでもう一度どうぞ' } }
  if (!j.ok) {
    $('#err').textContent = j.error || 'うまくいきませんでした'; $('#err').hidden = false; $('#go').textContent = 'この内容で予約する';
    if (/埋まり/.test(j.error || '')) { try { const r = await fetch(API + '?action=slots'); st.slots = (await r.json()).slots || []; st.start = null; render() } catch (e) {} }
    upd(); return
  }
  const text = ['【100人カイギ 事前インタビューの予約】', '登壇日: ' + lbl(st.ev), 'インタビュー: ' + j.label, '場所: ' + j.place, 'お名前: ' + body.name].concat(body.note ? ['ひとこと: ' + body.note] : []).join('\n');
  let sent = false;
  try { if (liff.isInClient()) { await liff.sendMessages([{ type: 'text', text }]); sent = true } } catch (e) {}
  $('#bar').hidden = true;
  document.querySelector('.wrap').innerHTML = `<div class="done"><p class="k">韮崎100人カイギ</p><h1>予約しました</h1>
  <div class="card"><dl><dt>インタビュー</dt><dd>${esc(j.label)}</dd><dt>場所</dt><dd>${esc(j.place)}</dd><dt>登壇日</dt><dd>${esc(lbl(st.ev))}</dd><dt>お名前</dt><dd>${esc(body.name)}</dd></dl></div>
  <p>${sent ? '予約の内容を LINE のトークにも送りました。' : ''}当日までに、西村からトークで確認のご連絡をします。日時や場所を変えたいときも、トークでお知らせください。</p>
  <button class="go" onclick="liff.closeWindow()">トークに戻る</button></div>`;
};
main();
</script>
</body></html>
